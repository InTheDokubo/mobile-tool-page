<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ORACLE//FIELD</title>
  <style>
    :root { color-scheme: dark; --bg:#071119; --panel:#0d202c; --line:#284554; --ink:#edf8fa; --muted:#8ca9b4; --accent:#f3c74c; --danger:#ff6e72; --good:#7de1aa; }
    * { box-sizing:border-box } body { margin:0; min-height:100dvh; background:radial-gradient(circle at top,#12354a,#071119 58%); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    button { font:inherit; color:inherit; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent } .app { max-width:680px; min-height:100dvh; margin:auto; padding:12px 12px calc(18px + env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:2px 2px 12px } h1 { font-size:17px; letter-spacing:.12em; margin:0 } .sub { color:var(--muted); font-size:11px }
    .arena { display:grid; gap:10px } .player { background:rgba(8,25,35,.86); border:1px solid var(--line); border-radius:15px; padding:10px; transition:.2s } .player.active { border-color:var(--accent); box-shadow:0 0 0 1px #f3c74c55,0 0 22px #f3c74c1a } .player.dead { opacity:.42; filter:grayscale(1) }
    .who { display:flex; justify-content:space-between; align-items:center; font-weight:800; letter-spacing:.06em } .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px } .stat { background:#071821; padding:6px 7px; border-radius:8px; font-size:12px } .stat b { display:block; font-size:16px } .hp b { color:#ff8a8a }.mp b{color:#86c9ff}.gold b{color:#f3c74c}.status { min-height:18px; margin-top:7px; color:#ffd56e; font-size:11px }
    .middle { min-height:145px; position:relative; display:grid; place-items:center; text-align:center; background:#07182199; border:1px solid var(--line); border-radius:15px; overflow:hidden; padding:16px }.middle::before{content:"";position:absolute;width:220px;height:220px;border:1px solid #315768;border-radius:50%;opacity:.7}.middle>*{position:relative}.phase { color:var(--accent); font-size:12px; letter-spacing:.1em }.notice { margin-top:8px; font-size:14px; line-height:1.6; max-width:430px }.action { display:flex; gap:7px; flex-wrap:wrap; justify-content:center; margin-top:12px }.action button,.topbtn { background:#164154; padding:9px 12px; border-radius:9px; font-weight:700 }.action button.primary { background:#c89f2d; color:#11212a }.action button.warn { background:#83333a }.action button:disabled { opacity:.4; cursor:not-allowed }
    .handtitle { display:flex; justify-content:space-between; align-items:end; margin:14px 2px 7px; font-size:12px; color:var(--muted) }.hand { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px }.card { position:relative; text-align:left; min-height:111px; padding:9px; border-radius:12px; background:linear-gradient(145deg,#163848,#0c202c); border:1px solid #2b5061; overflow:hidden }.card.sel { transform:translateY(-4px); border-color:var(--accent); box-shadow:0 0 0 1px #f3c74c77 }.card.disabled{opacity:.4}.card .tag{font-size:10px;color:#9fd9e7;letter-spacing:.07em}.card .name{font-size:13px;font-weight:800;margin:7px 0 5px}.card .value{font-size:20px;color:var(--accent);font-weight:900}.card .desc{font-size:10px;line-height:1.35;color:#b6d0d8;margin-top:4px}.card.fire{border-color:#b95345}.card.water{border-color:#408bc0}.card.wood{border-color:#5b9a65}.card.earth{border-color:#a78850}.card.light{border-color:#d9c557}.card.dark{border-color:#8a59b4}
    .log { margin-top:12px; border-top:1px solid var(--line); padding-top:8px; max-height:135px; overflow:auto; color:#a9c4cc; font-size:11px; line-height:1.65 }.log p{margin:0 0 3px}.overlay{position:fixed;inset:0;background:#02090ddd;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(520px,100%);background:#0c202c;border:1px solid #436878;border-radius:17px;padding:18px;text-align:center}.modal h2{margin:0 0 9px;font-size:19px}.modal p{color:#bbd1d8;font-size:13px;line-height:1.65}.modal button{background:var(--accent);color:#172129;border-radius:9px;padding:12px 18px;font-weight:900;margin-top:8px}.hidden{display:none}@media(min-width:560px){.hand{grid-template-columns:repeat(5,minmax(0,1fr))}.card{min-height:124px}}
  </style>
</head>
<body><main class="app">
  <header><div><h1>ORACLE//FIELD</h1><div class="sub">two prophets / random relic battle</div></div><button class="topbtn" id="restart">RESTART</button></header>
  <section class="arena"><div id="cpu"></div><div class="middle"><div><div class="phase" id="phase">PREPARE</div><div class="notice" id="notice">遺物を授かり、相手のHPを0にせよ。</div><div class="action" id="actions"></div></div></div><div id="you"></div></section>
  <div class="handtitle"><span>YOUR RELICS</span><span id="handcount"></span></div><section class="hand" id="hand"></section><section class="log" id="log"></section>
</main><div class="overlay" id="intro"><div class="modal"><h2>ORACLE//FIELD</h2><p>ゴッドフィールド型の、ランダム神器・攻防即時処理・補充型カードバトル。<br>攻撃を選び、相手を選び、中央で発動する。攻撃を受けたら防具を選び、防御するか許す。</p><button id="start">降臨する</button></div></div>
<script>
(() => {
  const A={none:'無',fire:'火',water:'水',wood:'木',earth:'土',light:'光',dark:'闇'};
  const base=[
    ['copper','鉄片こん棒','weapon',1,'none','',1.0],['whip','連結ムチ','weapon',2,'none','',1.2],['punch','衝撃拳','weapon',3,'none','',1.2],['hatchet','双月斧','weapon',4,'none','',1.1],['sickle','連鎖ガマ','weapon',5,'none','',1],['hammer','地鳴り槌','weapon',6,'none','',.9],['spear','天穿ちの槍','weapon',9,'none','',.6],['blade','幻影剣','weapon',12,'none','drain',.25],['godblade','原初の剣','weapon',30,'none','',.12],
    ['torch','赤熱の短剣','weapon',4,'fire','',.25],['ice','霜槌','weapon',5,'water','',.25],['root','根刃','weapon',4,'wood','',.25],['stone','石棘槍','weapon',6,'earth','',.25],['ray','白光の槍','weapon',7,'light','',.2],['grave','別れの鎌','weapon',4,'dark','',.2],
    ['plus1','小型投げ矢','plus',1,'none','',.35],['plus3','旋回刃','plus',3,'none','',.3],['plus5','戦士の弓','plus',5,'none','',.25],['plusfire','火種の矢','plus',2,'fire','dye',.18],['pluswater','水紋の矢','plus',5,'water','dye',.14],
    ['buckler','銅の盾','armor',2,'none','',.8],['plate','鋼の鎧','armor',5,'none','',.65],['wall','城壁の欠片','armor',9,'none','',.35],['rainbow','七彩の帳','armor',3,'light','rainbow',.18],['mirror','反照の剣','armor',5,'none','reflect',.22],['angel','天使の外套','armor',8,'light','stopMiracle',.12],['ring','冥王の指輪','armor',0,'dark','darkGuard',.12],['fireguard','水晶の衣','armor',4,'water','',.22],['waterguard','熾火の衣','armor',4,'fire','',.22],['woodguard','土偶の鎧','armor',4,'earth','',.22],['earthguard','樹皮の鎧','armor',4,'wood','',.22],
    ['heal','命の雫','item',10,'none','heal',.38],['mana','蒼い雫','item',10,'none','mana',.32],['cure','清めの札','item',0,'none','cure',.25],['trade','等価の秤','item',0,'none','exchange',.2],['sell','奉納帳','item',0,'none','sell',.18],['storm','嵐の器','all',5,'water','',.15],['flare','陽炎の器','all',7,'fire','',.15],['void','影の手','all',2,'dark','',.12],
    ['bolt','雷撃の奇跡','miracle',8,'light','',.12,8],['flood','大雨の奇跡','miracle',12,'water','',.1,13],['bless','祝福の奇跡','miracle',0,'none','heal',.1,8],['plague','夢見の奇跡','miracle',0,'none','dream',.08,7]
  ];
  const cards=base.map(([id,name,type,value,attr,effect,weight,mp])=>({id,name,type,value,attr,effect,weight,mp:mp||0,price:Math.max(1,value||10)}));
  const G={players:[],turn:0,selected:[],target:1,pending:null,logs:[],turnNo:0,ended:false};
  const $=s=>document.querySelector(s); const el=(tag,cls,html)=>{const x=document.createElement(tag);x.className=cls||'';x.innerHTML=html||'';return x};
  const sample=()=>{let n=Math.random()*cards.reduce((s,c)=>s+c.weight,0);return cards.find(c=>(n-=c.weight)<=0)||cards[0]};
  const draw=(p,n=1)=>{for(let i=0;i<n;i++){if(p.hand.length>=18){p.hand.splice(Math.floor(Math.random()*p.hand.length),1);log(`${p.name}の手札があふれた`)} p.hand.push(structuredClone(sample()))}};
  const newPlayer=(name,cpu)=>{const p={name,cpu,hp:40,mp:10,gold:10,hand:[],miracles:[],statuses:[],alive:true};draw(p,9);return p};
  const log=t=>{G.logs.unshift(t);G.logs=G.logs.slice(0,28)};
  function init(){G.players=[newPlayer('あなた',false),newPlayer('機械の預言者',true)];G.turn=Math.random()<.5?0:1;G.selected=[];G.target=1;G.pending=null;G.turnNo=0;G.ended=false;G.logs=[];log('戦いが始まった');render();if(G.players[G.turn].cpu)setTimeout(cpuTurn,600)}
  const statusText=p=>p.statuses.map(s=>({dream:'夢',fog:'霧',sick:'病'}[s]||s)).join(' / ')||'状態異常なし';
  function playerPanel(p,i){const div=el('div',`player ${G.turn===i&&!G.pending?'active':''} ${!p.alive?'dead':''}`,`<div class="who"><span>${p.name}${p.cpu?' [CPU]':''}</span><small>${p.alive?'ALIVE':'ASCENDED'}</small></div><div class="stats"><div class="stat hp">HP<b>${p.hp}</b></div><div class="stat mp">MP<b>${p.mp}</b></div><div class="stat gold">￥<b>${p.gold}</b></div></div><div class="status">${statusText(p)}</div>`);return div}
  function render(){const me=G.players[0],enemy=G.players[1];$('#you').replaceChildren(playerPanel(me,0));$('#cpu').replaceChildren(playerPanel(enemy,1));$('#handcount').textContent=`${me.hand.length} / 18`; $('#log').innerHTML=G.logs.map(x=>`<p>› ${x}</p>`).join('');const hand=$('#hand');hand.innerHTML='';me.hand.forEach((c,i)=>{const usable=canUse(c,me);const b=el('button',`card ${c.attr} ${G.selected.includes(i)?'sel':''} ${!usable?'disabled':''}`,`<div class="tag">${tag(c)}</div><div class="name">${c.name}</div><div class="value">${valueText(c)}</div><div class="desc">${desc(c)}</div>`);b.disabled=!usable||G.ended||me.cpu;b.onclick=()=>choose(i);hand.append(b)});viewCenter()}
  const tag=c=>({weapon:'攻撃',plus:'追加攻撃',armor:'防御',item:'雑貨',all:'全体攻撃',miracle:'奇跡'}[c.type]);const valueText=c=>c.type==='miracle'?`MP ${c.mp}`:c.type==='armor'?`守 ${c.value}`:c.type==='plus'?`+攻 ${c.value}`:`攻 ${c.value}`;
  const desc=c=>({heal:'HPを10回復',mana:'MPを10回復',cure:'災いを解除',exchange:'HP・MP・金を交換',sell:'選択した遺物を売却',drain:'与えたダメージ分HP回復',reflect:'無属性攻撃を反射',rainbow:'属性攻撃を無属性化',dye:'攻撃属性を染める',dream:'相手を夢にする'}[c.effect]||(`${A[c.attr]}属性`));
  function canUse(c,p){if(G.pending)return c.type==='armor';if(G.turn!==0)return false;if(c.type==='armor')return false;if(c.type==='miracle')return p.mp>=c.mp; if((c.type==='weapon'||c.type==='all')&&G.selected.some(i=>['weapon','all'].includes(p.hand[i]?.type)))return false;return true}
  function choose(i){const me=G.players[0],c=me.hand[i];if(!canUse(c,me))return;if(c.type==='item'||c.type==='miracle'){resolvePlay(0,[i],1);return}if(G.selected.includes(i))G.selected=G.selected.filter(x=>x!==i);else {if(c.type==='weapon'||c.type==='all')G.selected=G.selected.filter(x=>!['weapon','all'].includes(me.hand[x]?.type));G.selected.push(i)}render()}
  function viewCenter(){const a=$('#actions'), phase=$('#phase'),notice=$('#notice');a.innerHTML='';if(G.ended){phase.textContent='RESULT';notice.textContent=G.players[0].alive?'あなたは新たな地神となった':'あなたは昇天した';return}if(G.pending){phase.textContent='DEFENCE';notice.innerHTML=`${G.players[G.pending.defender].name}への攻撃<br><b>攻 ${G.pending.attack}</b> / ${A[G.pending.attr]}属性`;if(G.pending.defender===0){const go=el('button','primary','防御する');go.onclick=()=>defend();a.append(go);const pass=el('button','warn','許す');pass.onclick=()=>finishAttack(0,[]);a.append(pass)}return}const me=G.players[0];if(G.turn===0){phase.textContent='YOUR TURN';notice.textContent=G.selected.length?`${G.selected.length}枚を選択中。中央で発動する。`:'攻撃・雑貨・奇跡を選ぶ';if(G.selected.length){const fire=el('button','primary','選択を発動');fire.onclick=()=>resolvePlay(0,G.selected,1);a.append(fire)} const pray=el('button','','祈る');pray.disabled=me.hand.some(c=>c.type==='weapon'||c.type==='all');pray.onclick=()=>{draw(me);log('あなたは祈り、遺物を1枚授かった');endTurn()};a.append(pray)}else{phase.textContent='OPPONENT TURN';notice.textContent='機械の預言者が選択中…'}}
  function resolvePlay(actor,idxs,target){const p=G.players[actor], chosen=idxs.map(i=>p.hand[i]).filter(Boolean);if(!chosen.length)return;G.selected=[];const primary=chosen.find(c=>['weapon','all'].includes(c.type));const miracle=chosen.find(c=>c.type==='miracle');const item=chosen.find(c=>c.type==='item');if(item){useItem(actor,item,idxs[0]);return}if(miracle){p.mp-=miracle.mp;p.miracles.push(miracle.id);log(`${p.name}は${miracle.name}を唱えた`);if(miracle.effect==='heal'){p.hp+=10;endTurn();return} if(miracle.effect==='dream'){G.players[target].statuses.push('dream');endTurn();return}attack(actor,target,[miracle],true);return}if(primary)attack(actor,primary.type==='all'?null:target,chosen,false)}
  function useItem(actor,c,idx){const p=G.players[actor],op=G.players[1-actor];p.hand.splice(idx,1);draw(p); if(c.effect==='heal'){p.hp+=10;log(`${p.name}のHPが10回復`)}else if(c.effect==='mana'){p.mp+=10;log(`${p.name}のMPが10回復`)}else if(c.effect==='cure'){p.statuses=[];log(`${p.name}は災いを清めた`)}else if(c.effect==='exchange'){p.gold=Math.max(0,p.gold-10);p.hp+=10;log(`${p.name}は￥10をHPに交換`)}else if(c.effect==='sell'){const victim=op.hand[Math.floor(Math.random()*op.hand.length)];if(victim){op.hand.splice(op.hand.indexOf(victim),1);p.gold+=victim.price;log(`${p.name}は${victim.name}を買い取った`)}}endTurn()}
  function attack(actor,target,chosen,miracle){const p=G.players[actor];const main=chosen.find(c=>['weapon','all','miracle'].includes(c.type));let attack=chosen.reduce((s,c)=>s+(c.type==='plus'||c===main?c.value:0),0);let attr=main.attr;const dye=chosen.find(c=>c.effect==='dye');if(dye)attr=dye.attr;else if(new Set(chosen.filter(c=>c.attr!=='none'&&c.attr!=='light').map(c=>c.attr)).size>1)attr='none';const targets=main.type==='all'?G.players.map((x,i)=>i).filter(i=>i!==actor&&G.players[i].alive):[target];log(`${p.name}は${chosen.map(c=>c.name).join(' + ')}を使った`);const spent=chosen.filter(c=>c.type!=='miracle').map(c=>p.hand.indexOf(c)).filter(i=>i>=0).sort((a,b)=>b-a);spent.forEach(i=>p.hand.splice(i,1));draw(p,spent.length);G.pending={actor,defender:targets[0],attack,attr,chosen,miracle,targets};render();if(G.pending.defender===1)setTimeout(cpuDefend,450)}
  function validArmor(c,attr){if(c.effect==='rainbow')return true;if(attr==='none'||attr==='dark')return true;if(attr==='light')return false;const map={fire:['water','light'],water:['fire','light'],wood:['earth','light'],earth:['wood','light']};return map[attr]?.includes(c.attr)}
  function defend(){const p=G.players[0],idxs=G.selected.filter(i=>p.hand[i]?.type==='armor'&&validArmor(p.hand[i],G.pending.attr));finishAttack(0,idxs)}
  function finishAttack(defender,idxs){const q=G.pending;if(!q)return;const d=G.players[defender],a=G.players[q.actor],used=idxs.map(i=>d.hand[i]);let attr=q.attr;if(used.some(c=>c.effect==='rainbow'))attr='none';const defense=used.reduce((s,c)=>s+c.value,0);idxs.sort((a,b)=>b-a).forEach(i=>d.hand.splice(i,1));draw(d,idxs.length);let dmg=Math.max(0,q.attack-defense);if(used.some(c=>c.effect==='reflect')&&attr==='none'){a.hp-=q.attack;log(`${d.name}は攻撃を反射！ ${a.name}に${q.attack}ダメージ`);dmg=0}if(attr==='dark'&&dmg>0)dmg=999;d.hp-=dmg;if(q.chosen.some(c=>c.effect==='drain'))a.hp+=dmg;log(`${d.name}${used.length?'は防御した':'は許した'}。${dmg?`${dmg}ダメージ`:'ダメージなし'}`);G.selected=[];G.pending=null;checkDead();if(!G.ended)endTurn()}
  function checkDead(){G.players.forEach(p=>{if(p.hp<=0&&p.alive){p.hp=0;p.alive=false;log(`${p.name}は昇天した`)}});if(!G.players[0].alive||!G.players[1].alive)G.ended=true}
  function endTurn(){if(G.ended){render();return}G.turn=1-G.turn;G.turnNo++;if(G.turnNo>=50&&Math.random()<.25){const p=G.players[G.turn];p.hp-=10;log('終末の悪魔が現れ、10ダメージ');checkDead()}render();if(!G.ended&&G.players[G.turn].cpu)setTimeout(cpuTurn,650)}
  function cpuTurn(){if(G.ended)return;const p=G.players[1];const kill=p.hand.find(c=>(c.type==='weapon'||c.type==='all')&&c.value>=G.players[0].hp);const useful=kill||p.hand.find(c=>c.type==='item'&&(c.effect==='heal'&&p.hp<25||c.effect==='mana'&&p.mp<5))||p.hand.find(c=>c.type==='weapon'||c.type==='all')||p.hand.find(c=>c.type==='miracle'&&p.mp>=c.mp);if(!useful){draw(p);log('機械の預言者は祈った');endTurn();return}const i=p.hand.indexOf(useful);if(useful.type==='item'||useful.type==='miracle'){resolvePlay(1,[i],0);return}const adds=p.hand.map((c,j)=>({c,j})).filter(x=>x.c.type==='plus').slice(0,Math.random()<.55?2:0).map(x=>x.j);resolvePlay(1,[i,...adds],0)}
  function cpuDefend(){const q=G.pending,p=G.players[1];if(!q)return;const candidates=p.hand.map((c,i)=>({c,i})).filter(x=>x.c.type==='armor'&&validArmor(x.c,q.attr));let sum=0,idx=[];for(const x of candidates.sort((a,b)=>b.c.value-a.c.value)){if(sum>=q.attack)break;sum+=x.c.value;idx.push(x.i)}if(q.attack<=3&&Math.random()<.55)idx=[];finishAttack(1,idx)}
  $('#start').onclick=()=>{$('#intro').classList.add('hidden');init()};$('#restart').onclick=()=>init();
})();
</script></body></html>
